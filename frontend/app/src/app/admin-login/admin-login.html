<div class="admin-login-page">
    <div class="login-card">
        <span class="section-label">ADMINISTRACIJA</span>
        <h1>Admin prijava</h1>
        <p class="description">
            Prijavite se administratorskim korisničkim nalogom.
        </p>

        <form (ngSubmit)="adminLogin()">
            <div class="form-group">
                <label for="username">Korisničko ime</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    [(ngModel)]="username"
                    autocomplete="username"
                    placeholder="Korisničko ime">
            </div>

            <div class="form-group">
                <label for="password">Lozinka</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    [(ngModel)]="password"
                    autocomplete="current-password"
                    placeholder="Lozinka">
            </div>

            <button
                type="submit"
                class="login-btn"
                [disabled]="loading">
                {{loading?'PRIJAVLJIVANJE...':'PRIJAVITE SE'}}
            </button>

            @if(message){
                <div
                    class="message"
                    [style.color]="msgColor">
                    {{message}}
                </div>
            }
        </form>
    </div>
</div>
