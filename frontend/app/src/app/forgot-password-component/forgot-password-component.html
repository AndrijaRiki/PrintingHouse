<app-header-component></app-header-component>
<main class="forgot-page">
    <section class="forgot-card">
        <h1>Zaboravljena lozinka</h1>
        <p class="description">Izaberite način identifikacije i poslaćemo vam link za promenu lozinke.</p>
        <form (ngSubmit)="requestReset()">
            <div class="form-group">
                <label for="option">Pretraga korisnika</label>
                <select id="option" name="option" [(ngModel)]="option" required>
                    <option value="email">E-mail</option>
                    <option value="username">Korisničko ime</option>
                </select>
            </div>
            <div class="form-group">
                <label for="data">{{ option === 'email' ? 'E-mail adresa' : 'Korisničko ime' }}</label>
                <input type="text" name="data" id="data" [(ngModel)]="data" required>
            </div>
            <button type="submit">POŠALJI LINK ZA RESET LOZINKE</button>
            @if(message) {
                <p class="message" [style.color]="msgColor">{{ message }}</p>
            }
        </form>
        @if(resetLink) {
            <div class="reset-section">
                <h2>Link za resetovanje</h2>
                <a [href]="resetLink">Resetuj lozinku</a>
            </div>
        }
    </section>
</main>
<app-footer-component></app-footer-component>
