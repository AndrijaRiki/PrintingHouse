<app-header-component></app-header-component>

<h1>Login</h1>
<form (ngSubmit)="login()">
    <div>
        Korisnicko ime: <input type="text" name="username" id="username" [(ngModel)]="username">
    </div>
    <div>
        Lozinka: <input type="password" name="password" id="password" [(ngModel)]="password">
    </div>
    <input type="submit" value="Prijavite se">
    <div>
        <span [style.color]="msgColor">{{message}}</span>
    </div>
    <div>
        <a routerLink="/forgotPassword">Zaboravljena lozinka?</a>
    </div>
</form>

<app-footer-component></app-footer-component>
