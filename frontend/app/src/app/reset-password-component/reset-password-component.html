<h1>Promena lozinke</h1>

<form (ngSubmit)="resetPassword()">
    <div>
        Nova lozinka: <input type="password" name="password" [(ngModel)]="password">
    </div>
    <div>
        Ponovite lozinku: <input type="password" name="repeatPassword" [(ngModel)]="repeatPassword">
    </div>
    <button type="submit">Promenite lozinku</button>
    <div (style.color)="msgColor">{{message}}</div>
</form>
